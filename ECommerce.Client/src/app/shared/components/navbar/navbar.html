<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand" routerLink="/">Vortex </a>

  <button class="navbar-toggler" type="button" [attr.aria-expanded]="isMenuOpen" (click)="isMenuOpen = !isMenuOpen">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" routerLink="/" routerLinkActive="active">Home</a></li>
      <li class="nav-item"><a class="nav-link" routerLink="/products" routerLinkActive="active">Products</a></li>
    </ul>

    @if(isLoggedIn()) {
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" routerLink="/orders" routerLinkActive="active">Orders</a></li>
      <li class="nav-item"><a class="nav-link" routerLink="/profile" routerLinkActive="active">Profile</a></li>
      <li class="nav-item"><a class="nav-link" routerLink="/cart" routerLinkActive="active">Cart</a></li>
      <li class="nav-item"><a class="nav-link" routerLink="/wishlist" routerLinkActive="active">Wishlist</a></li>
      @if(isAdmin()) {
      <li class="nav-item"><a class="nav-link" routerLink="/admin/overview" routerLinkActive="active">Admin</a></li> }
      @if(isSeller()) {
      <li class="nav-item"><a class="nav-link" routerLink="/seller/dashboard" routerLinkActive="active">Seller</a></li>
      }
      <li class="nav-item">
        <button class="btn btn-outline-light ms-2" (click)="logout()">Logout</button>
      </li>
    </ul>
    } @else {
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" routerLink="/auth/login">Login</a></li>
      <li class="nav-item"><a class="nav-link" routerLink="/auth/register-type">Register</a></li>
    </ul>
    }
  </div>
</nav>
