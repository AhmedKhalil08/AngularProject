<div class="login-container">

  <div class="login-card">
    
    <div class="login-header">
          <a routerLink="/" class="back-home">
    <i class="bi bi-arrow-left"></i> Back to Home
  </a>
  
      <div class="login-logo">
  <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
    <path d="M16 2 C8 2 2 8 2 16 C2 24 8 30 16 30" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 2 C24 2 30 8 30 16 C30 20 28 24 24 27" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="16" cy="16" r="4" fill="white"/>
  </svg>
        <span>VORTEX</span>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to your account</p>
    </div>
@if(successMessage) {
  <div class="success-alert">
    <i class="bi bi-envelope-check"></i> {{ successMessage }}
  </div>
}
    @if(errorMessage) {
      <div class="error-alert">
        <i class="bi bi-exclamation-circle"></i> {{ errorMessage }}
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label>Email or Username</label>
        <input type="text" class="form-input" formControlName="emailOrUserName" placeholder="Enter your email or username" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-input" formControlName="password" placeholder="Enter your password" />
      </div>

      <button type="submit" class="login-btn" [disabled]="isLoading">
        @if(isLoading) {
          <span class="spinner-border spinner-border-sm"></span> Signing in...
        } @else {
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        }
      </button>
    </form>

    <div class="divider"><span>or continue with</span></div>

    <div class="social-btns">
      <button class="social-btn google-btn" (click)="loginWithGoogle()">
        <img src="https://www.google.com/favicon.ico" width="18" /> Google
      </button>
      <button class="social-btn facebook-btn" (click)="loginWithFacebook()">
        <i class="bi bi-facebook"></i> Facebook
      </button>
    </div>

    <div class="login-footer">
      Don't have an account? <a routerLink="/auth/register-type">Sign Up</a>
    </div>

  </div>
</div>
