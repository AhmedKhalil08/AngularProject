<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <h2 class="text-center mb-4">Login</h2>

      @if (errorMessage) {
  <div class="alert alert-danger">{{ errorMessage }}</div>
}

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email or Username</label>
          <input type="text" class="form-control" formControlName="emailOrUserName" />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" formControlName="password" />
        </div>

        <button type="submit" class="btn btn-outline-info w-100" [disabled]="isLoading">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
      </form>
      <div>
      <button type="button" class="btn btn-danger w-100 mt-2" (click)="loginWithGoogle()">
                    Login with Google
            </button>
            </div>
            <div>
            <button type="button" class="btn btn-primary w-100 mt-2" (click)="loginWithFacebook()">
                  Login with Facebook
          </button>
          </div>
    </div>
  </div>
</div>
